<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canva Replica</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light;
        --page-bg: #efeff1;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100dvh;
        place-items: center;
        overflow: hidden;
        background: var(--page-bg);
      }

      .canvas-stage {
        width: 100vw;
        height: 100dvh;
        display: grid;
        place-items: center;
      }

      .video-frame,
      .popup-frame {
        width: min(100vw, calc(100dvh * 940 / 1672));
        aspect-ratio: 940 / 1672;
        position: relative;
      }

      .video-frame video,
      .popup-frame video {
        width: 100%;
        height: 100%;
        max-width: 100vw;
        max-height: 100dvh;
        display: block;
        object-fit: contain;
        user-select: none;
        background: var(--page-bg);
      }

      .video-frame video {
        transform: translateZ(0);
      }

      .hotspot {
        position: absolute;
        z-index: 3;
        border: 0;
        padding: 0;
        cursor: pointer;
        background: transparent;
        appearance: none;
      }

      .hotspot:focus-visible {
        outline: 2px solid rgba(0, 93, 255, 0.7);
        outline-offset: 2px;
      }

      .hotspot-ai {
        left: 45%;
        top: 9%;
        width: 25%;
        height: 15%;
      }

      .hotspot-product {
        left: 54%;
        top: 28%;
        width: 28%;
        height: 13%;
      }

      .hotspot-expert {
        left: 31%;
        top: 42%;
        width: 30%;
        height: 12%;
      }

      .hotspot-festival {
        left: 27%;
        top: 59%;
        width: 28%;
        height: 15%;
      }

      .hotspot-opentalk {
        left: 37%;
        top: 81%;
        width: 30%;
        height: 12%;
      }

      .popup-layer {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        place-items: center;
        background: transparent;
        pointer-events: none;
      }

      .popup-layer.is-visible {
        display: grid;
      }

      .popup-frame {
        pointer-events: none;
      }

      .popup-frame video {
        position: absolute;
        inset: 0;
      }

      .popup-card-hitbox {
        position: absolute;
        pointer-events: auto;
      }

      .popup-video-ai {
        clip-path: inset(2% 2% 70% 45%);
      }

      .hitbox-ai {
        left: 61%;
        top: 3%;
        width: 36%;
        height: 24%;
      }

      .popup-video-product {
        clip-path: inset(20% 44% 59% 24%);
      }

      .hitbox-product {
        left: 25%;
        top: 21%;
        width: 30%;
        height: 20%;
      }

      .popup-video-expert {
        clip-path: inset(40% 10% 41% 58%);
      }

      .hitbox-expert {
        left: 59%;
        top: 41%;
        width: 30%;
        height: 18%;
      }

      .popup-video-festival {
        clip-path: inset(58% 70% 20% 0%);
      }

      .hitbox-festival {
        left: 0%;
        top: 59%;
        width: 31%;
        height: 20%;
      }

      .popup-video-opentalk {
        clip-path: inset(80% 7% 1% 63%);
      }

      .hitbox-opentalk {
        left: 64%;
        top: 81%;
        width: 30%;
        height: 18%;
      }
    </style>
  </head>
  <body>
    <main class="canvas-stage" aria-label="Canva design replica">
      <div class="video-frame">
        <video
          src="assets/canva-design.mp4"
          poster="assets/canva-poster.jpg"
          width="940"
          height="1672"
          autoplay
          muted
          playsinline
          webkit-playsinline
          x5-playsinline
          x5-video-player-type="h5"
          x5-video-player-fullscreen="false"
          preload="auto"
          fetchpriority="high"
          aria-label="Canva dynamic design"
        ></video>
        <button
          class="hotspot hotspot-ai"
          type="button"
          data-popup-target="ai"
          aria-label="Open AI challenge"
        ></button>
        <button
          class="hotspot hotspot-product"
          type="button"
          data-popup-target="product"
          aria-label="Open product experience"
        ></button>
        <button
          class="hotspot hotspot-expert"
          type="button"
          data-popup-target="expert"
          aria-label="Open expert session"
        ></button>
        <button
          class="hotspot hotspot-festival"
          type="button"
          data-popup-target="festival"
          aria-label="Open creation festival"
        ></button>
        <button
          class="hotspot hotspot-opentalk"
          type="button"
          data-popup-target="opentalk"
          aria-label="Open OpenTalk"
        ></button>
      </div>
    </main>

    <div class="popup-layer" data-popup="ai" aria-hidden="true">
      <div class="popup-frame" role="dialog" aria-label="AI challenge">
        <video
          class="popup-video-ai"
          src="assets/ai-challenge-popup.mp4"
          muted
          playsinline
          webkit-playsinline
          x5-playsinline
          x5-video-player-type="h5"
          x5-video-player-fullscreen="false"
          preload="auto"
          aria-label="AI challenge popup animation"
        ></video>
        <div class="popup-card-hitbox hitbox-ai" aria-hidden="true"></div>
      </div>
    </div>

    <div class="popup-layer" data-popup="product" aria-hidden="true">
      <div class="popup-frame" role="dialog" aria-label="Product experience">
        <video
          class="popup-video-product"
          src="assets/other-popups.mp4"
          muted
          playsinline
          webkit-playsinline
          x5-playsinline
          x5-video-player-type="h5"
          x5-video-player-fullscreen="false"
          preload="auto"
          aria-label="Product experience popup animation"
        ></video>
        <div class="popup-card-hitbox hitbox-product" aria-hidden="true"></div>
      </div>
    </div>

    <div class="popup-layer" data-popup="expert" aria-hidden="true">
      <div class="popup-frame" role="dialog" aria-label="Expert session">
        <video
          class="popup-video-expert"
          src="assets/other-popups.mp4"
          muted
          playsinline
          webkit-playsinline
          x5-playsinline
          x5-video-player-type="h5"
          x5-video-player-fullscreen="false"
          preload="auto"
          aria-label="Expert session popup animation"
        ></video>
        <div class="popup-card-hitbox hitbox-expert" aria-hidden="true"></div>
      </div>
    </div>

    <div class="popup-layer" data-popup="festival" aria-hidden="true">
      <div class="popup-frame" role="dialog" aria-label="Creation festival">
        <video
          class="popup-video-festival"
          src="assets/other-popups.mp4"
          muted
          playsinline
          webkit-playsinline
          x5-playsinline
          x5-video-player-type="h5"
          x5-video-player-fullscreen="false"
          preload="auto"
          aria-label="Creation festival popup animation"
        ></video>
        <div class="popup-card-hitbox hitbox-festival" aria-hidden="true"></div>
      </div>
    </div>

    <div class="popup-layer" data-popup="opentalk" aria-hidden="true">
      <div class="popup-frame" role="dialog" aria-label="OpenTalk">
        <video
          class="popup-video-opentalk"
          src="assets/other-popups.mp4"
          muted
          playsinline
          webkit-playsinline
          x5-playsinline
          x5-video-player-type="h5"
          x5-video-player-fullscreen="false"
          preload="auto"
          aria-label="OpenTalk popup animation"
        ></video>
        <div class="popup-card-hitbox hitbox-opentalk" aria-hidden="true"></div>
      </div>
    </div>

    <script>
      const mainVideo = document.querySelector(".video-frame video");
      const popupButtons = document.querySelectorAll("[data-popup-target]");
      const popupLayers = new Map(
        Array.from(document.querySelectorAll(".popup-layer")).map((layer) => [
          layer.dataset.popup,
          {
            id: layer.dataset.popup,
            layer,
            video: layer.querySelector("video"),
            state: "closed",
          },
        ])
      );
      const popupTimings = {
        ai: { openStart: 0, hold: 1.15, closeStart: 4.15, closeEnd: 4.9 },
        product: { openStart: 5.05, hold: 6.25, closeStart: 8.75, closeEnd: 10 },
        expert: { openStart: 5.05, hold: 6.25, closeStart: 8.75, closeEnd: 10 },
        festival: { openStart: 5.05, hold: 6.25, closeStart: 8.75, closeEnd: 10 },
        opentalk: { openStart: 5.05, hold: 6.25, closeStart: 8.75, closeEnd: 10 },
      };
      let activePopupId = null;
      let mainPlaybackSuspended = false;
      let mainShouldResumeAfterPopups = false;

      function configureInlineVideo(video) {
        video.muted = true;
        video.defaultMuted = true;
        video.setAttribute("muted", "");
        video.setAttribute("playsinline", "");
        video.setAttribute("webkit-playsinline", "");
        video.setAttribute("x5-playsinline", "");
      }

      configureInlineVideo(mainVideo);
      popupLayers.forEach(({ video }) => configureInlineVideo(video));

      function playVideo(video) {
        const playback = video.play();
        if (playback && typeof playback.catch === "function") {
          playback.catch(() => {});
        }
      }

      function kickPopupPlayback(popup) {
        playVideo(popup.video);
        window.setTimeout(() => {
          if (popup.state === "opening" && popup.video.paused) {
            playVideo(popup.video);
          }
        }, 80);
        window.setTimeout(() => {
          if (popup.state === "opening" && popup.video.paused) {
            playVideo(popup.video);
          }
        }, 180);
      }

      function playMainVideo() {
        if (mainPlaybackSuspended) return;
        if (mainVideo.ended) return;
        const playback = mainVideo.play();
        if (playback && typeof playback.catch === "function") {
          playback.catch(() => {});
        }
      }

      function anyPopupVisible() {
        return Array.from(popupLayers.values()).some(
          (popup) => popup.state !== "closed"
        );
      }

      function suspendMainVideo() {
        if (!mainPlaybackSuspended) {
          mainShouldResumeAfterPopups = !mainVideo.paused && !mainVideo.ended;
        }
        mainPlaybackSuspended = true;
        mainVideo.pause();
      }

      function resumeMainVideoIfNeeded() {
        if (anyPopupVisible() || activePopupId) return;
        mainPlaybackSuspended = false;
        if (mainShouldResumeAfterPopups && !mainVideo.ended) {
          playMainVideo();
        }
        mainShouldResumeAfterPopups = false;
      }

      mainVideo.addEventListener("loadeddata", playMainVideo);
      mainVideo.addEventListener("canplay", playMainVideo);
      document.addEventListener("WeixinJSBridgeReady", playMainVideo, false);
      document.addEventListener("touchstart", playMainVideo, {
        once: true,
        passive: true,
      });
      window.addEventListener("pageshow", playMainVideo);
      [250, 1000, 2500].forEach((delay) => {
        window.setTimeout(playMainVideo, delay);
      });
      mainVideo.addEventListener(
        "ended",
        () => {
          mainVideo.pause();
          if (Number.isFinite(mainVideo.duration)) {
            mainVideo.currentTime = Math.max(0, mainVideo.duration - 0.04);
          }
        },
        { once: true }
      );

      function openPopup(id) {
        const popup = popupLayers.get(id);
        const timing = popupTimings[id];
        if (!popup || !timing) return;
        suspendMainVideo();
        popup.state = "opening";
        popup.layer.classList.add("is-visible");
        popup.layer.setAttribute("aria-hidden", "false");
        popup.video.pause();
        popup.video.currentTime = timing.openStart;
        popup.layer.offsetHeight;
        kickPopupPlayback(popup);
      }

      function finishClose(popup) {
        popup.video.pause();
        popup.video.currentTime = 0;
        popup.layer.classList.remove("is-visible");
        popup.layer.setAttribute("aria-hidden", "true");
        popup.state = "closed";
        resumeMainVideoIfNeeded();
      }

      function closePopup(id) {
        const popup = popupLayers.get(id);
        const timing = popupTimings[id];
        if (!popup || !timing || popup.state === "closed") return;
        popup.state = "closing";
        if (popup.video.currentTime < timing.closeStart) {
          popup.video.currentTime = timing.closeStart;
        }
        playVideo(popup.video);
      }

      function activatePopup(id) {
        const currentId = activePopupId;
        if (currentId === id) {
          activePopupId = null;
          closePopup(id);
          return;
        }
        if (currentId) {
          closePopup(currentId);
        }
        activePopupId = id;
        openPopup(id);
      }

      popupButtons.forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          activatePopup(button.dataset.popupTarget);
        });
      });

      popupLayers.forEach((popup) => {
        popup.video.addEventListener("timeupdate", () => {
          const timing = popupTimings[popup.id];
          if (popup.state === "opening" && popup.video.currentTime >= timing.hold) {
            popup.video.pause();
            popup.video.currentTime = timing.hold;
            popup.state = "open";
          }
          if (
            popup.state === "closing" &&
            popup.video.currentTime >= timing.closeEnd
          ) {
            finishClose(popup);
          }
        });
        popup.video.addEventListener("ended", () => {
          if (popup.state === "closing") {
            finishClose(popup);
          }
        });
      });

      document.addEventListener("click", (event) => {
        if (event.target.closest("[data-popup-target]")) return;
        if (event.target.closest(".popup-card-hitbox")) return;
        if (!activePopupId) return;
        const closingId = activePopupId;
        activePopupId = null;
        closePopup(closingId);
      });
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && activePopupId) {
          const closingId = activePopupId;
          activePopupId = null;
          closePopup(closingId);
        }
      });
    </script>
  </body>
</html>

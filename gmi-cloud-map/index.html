        display: grid;
        grid-template-columns: minmax(0, 1fr);

        padding: 0;
        border: 0;
        background: transparent;
        overflow: visible;
        transform-origin: 50% 100%;
        animation: photo-choice-in 120ms steps(2, end) both;

        left: -293.534%;

        pointer-events: none;

        right: -0.5em;

        visibility: visible;

        transform: translate3d(-50%, -50%, 0) scale(1);

        58% {

      function unlockFeedback() {
        feedbackState.isReady = true;
        feedbackRoot.dataset.feedbackReady = "true";
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return null;
        try {
          if (!feedbackState.audioContext) {
            feedbackState.audioContext = new AudioContext();
            feedbackState.masterGain = feedbackState.audioContext.createGain();
            feedbackState.masterGain.gain.value = 2.1;
            feedbackState.masterGain.connect(feedbackState.audioContext.destination);
          }
          feedbackState.audioContext.resume().then(
            () => {
              feedbackRoot.dataset.feedbackState = "running";
            },
            () => {
              feedbackRoot.dataset.feedbackState = "blocked";
            }
          );
        } catch {
          feedbackState.audioContext = null;
          feedbackState.masterGain = null;
          feedbackRoot.dataset.feedbackState = "unavailable";
        }
        return feedbackState.audioContext;
      }

      function primeFeedback() {
        unlockFeedback();

      function withFeedbackContext(callback) {
        const context = unlockFeedback();
        if (!context || !feedbackState.masterGain) return;
        const playWhenReady = () => {
          if (context.state !== "running") return;
          callback(context, feedbackState.masterGain);
        };
        if (context.state === "running") {
          playWhenReady();
        } else {
          context.resume().then(playWhenReady).catch(() => {});
        }
      }

      function playFeedback(kind) {
        const notes = feedbackPatterns[kind];
        if (!notes) return;
        withFeedbackContext((context, output) => {
          const start = context.currentTime + 0.005;
          notes.forEach(([frequency, duration, volume, type, delay], index) => {
            try {
              const oscillator = context.createOscillator();
              const gain = context.createGain();
              const noteStart = start + (delay ?? index * 0.055);
              oscillator.type = type;
              oscillator.frequency.setValueAtTime(frequency, noteStart);
              gain.gain.setValueAtTime(0.0001, noteStart);
              gain.gain.exponentialRampToValueAtTime(volume, noteStart + 0.008);
              gain.gain.exponentialRampToValueAtTime(volume * 0.7, noteStart + duration * 0.4);
              gain.gain.exponentialRampToValueAtTime(0.0001, noteStart + duration);
              oscillator.connect(gain).connect(output);
              oscillator.start(noteStart);
              oscillator.stop(noteStart + duration + 0.01);
            } catch {}
          });
        });
      }

      function playStampFeedback() {
        withFeedbackContext((context, output) => {
          const start = context.currentTime + 0.005;
          try {
          const thud = context.createOscillator();
          const thudGain = context.createGain();
          thud.type = "triangle";
          thud.frequency.setValueAtTime(150, start);
          thud.frequency.exponentialRampToValueAtTime(72, start + 0.06);
          thudGain.gain.setValueAtTime(0.0001, start);
          thudGain.gain.exponentialRampToValueAtTime(0.12, start + 0.006);
          thudGain.gain.exponentialRampToValueAtTime(0.0001, start + 0.072);
          thud.connect(thudGain).connect(output);
          thud.start(start);
          thud.stop(start + 0.082);

          const noiseLength = Math.ceil(context.sampleRate * 0.055);
          const noiseBuffer = context.createBuffer(1, noiseLength, context.sampleRate);
          const noiseData = noiseBuffer.getChannelData(0);
          for (let index = 0; index < noiseLength; index += 1) {
            noiseData[index] = (Math.random() * 2 - 1) * (1 - index / noiseLength);
          }
          const paper = context.createBufferSource();
          const paperFilter = context.createBiquadFilter();
          const paperGain = context.createGain();
          paper.buffer = noiseBuffer;
          paperFilter.type = "lowpass";
          paperFilter.frequency.setValueAtTime(1150, start);
          paperGain.gain.setValueAtTime(0.05, start);
          paperGain.gain.exponentialRampToValueAtTime(0.0001, start + 0.052);
          paper.connect(paperFilter).connect(paperGain).connect(output);
          paper.start(start);
          } catch {}
        });
      }

      function openPhotoDatabase() {
        if (!("indexedDB" in window)) return Promise.resolve(null);
        if (photoDatabasePromise) return photoDatabasePromise;
        photoDatabasePromise = new Promise((resolve, reject) => {
          const request = indexedDB.open(PHOTO_DATABASE_NAME, 1);
          request.onupgradeneeded = () => {
            const database = request.result;
            if (!database.objectStoreNames.contains(PHOTO_STORE_NAME)) {
              database.createObjectStore(PHOTO_STORE_NAME, { keyPath: "id" });
            }
          };
          request.onsuccess = () => {
            const database = request.result;
            database.onversionchange = () => {
              database.close();
              photoDatabasePromise = null;
            };
            resolve(database);
          };
          request.onerror = () => reject(request.error);
          request.onblocked = () => reject(new Error("Photo database is blocked"));
        }).catch((error) => {
          photoDatabasePromise = null;
          throw error;
        });
        return photoDatabasePromise;
      }

      async function persistPhoto(id, file) {

        const database = await openPhotoDatabase();
        if (!database) return;
        await new Promise((resolve, reject) => {
          const transaction = database.transaction(PHOTO_STORE_NAME, "readwrite");
          transaction.objectStore(PHOTO_STORE_NAME).put({ id, file, updatedAt: Date.now() });
          transaction.oncomplete = resolve;
          transaction.onerror = () => reject(transaction.error);
          transaction.onabort = () => reject(transaction.error);
        });
      }

            .objectStore(PHOTO_STORE_NAME)
            .getAll();
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error);
        });

      function drawPosterPhotoCover(context, image, x, y, width, height, radius) {
        const scale = Math.max(width / image.naturalWidth, height / image.naturalHeight);
        const sourceWidth = width / scale;
        const sourceHeight = height / scale;
        const sourceX = (image.naturalWidth - sourceWidth) / 2;
        const sourceY = (image.naturalHeight - sourceHeight) / 2;
        context.save();
        context.beginPath();
        if (typeof context.roundRect === "function") {
          context.roundRect(x, y, width, height, radius);
        } else {
          context.rect(x, y, width, height);
        }
        context.clip();
        context.drawImage(image, sourceX, sourceY, sourceWidth, sourceHeight, x, y, width, height);
        context.restore();
      }

        canvas.height = original.naturalHeight;
        const context = canvas.getContext("2d");
        if (!context) return null;
        context.drawImage(original, 0, 0);
        for (const slot of posterPhotoSlots) {
          const file = getPosterPhotoFile(slot.id);
          if (!file) continue;
          const url = URL.createObjectURL(file);
          try {
            const image = await loadPosterImage(url);
            drawPosterPhotoCover(
              context,
              image,
              (slot.sourceX / 100) * canvas.width,
              (slot.sourceY / 100) * canvas.height,
              (slot.sourceW / 100) * canvas.width,
              (slot.sourceH / 100) * canvas.height,
              slot.sourceRadius
            );
          } finally {
            URL.revokeObjectURL(url);
          }
        }
        return new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
      }

        if (posterExportUrl) return Promise.resolve(posterExportUrl);
        if (posterExportPromise) return posterExportPromise;
        posterPageLayer?.setAttribute("data-export-ready", "false");
        posterExportPromise = createPosterBlob()
          .then((blob) => {
            posterExportPromise = null;
            if (!blob) return "";
            posterExportBlob = blob;
            posterExportUrl = URL.createObjectURL(blob);
            if (posterCompositeImage) {
              posterCompositeImage.src = posterExportUrl;
              posterCompositeImage.hidden = false;
            }
            posterPageLayer?.setAttribute("data-export-ready", "true");
            return posterExportUrl;
          })
          .catch((error) => {
            posterExportPromise = null;
            posterPageLayer?.setAttribute("data-export-ready", "false");

        if (existing) return existing;
        const marker = document.createElement("img");

        marker.alt = "";

      function beginCheckmarkDrop(id) {
        const position = checkmarkPositions[id];
        if (!position || !checkmarkLayer) {
          playStampFeedback();
          vibrateFeedback(10);
          creditCheckin(id);
          return;
        }
        const marker = createCheckmarkMarker(id);
        if (!marker) return;
        let checkmarkSettled = false;
        let checkmarkImpactPlayed = false;
        const playCheckmarkImpact = () => {
          if (checkmarkImpactPlayed) return;
          checkmarkImpactPlayed = true;
          playStampFeedback();
          vibrateFeedback(10);
        };
        const settleCheckmark = () => {
          if (checkmarkSettled) return;
          checkmarkSettled = true;
          playCheckmarkImpact();
          marker.classList.remove("is-dropping");
          marker.classList.add("is-complete");
          creditCheckin(id);
        };
        marker.addEventListener(
          "animationend",
          settleCheckmark,
          { once: true }
        );
        window.requestAnimationFrame(() => {
          marker.classList.add("is-dropping");
          window.setTimeout(
            playCheckmarkImpact,
            CHECKMARK_DROP_DURATION_MS * CHECKMARK_IMPACT_RATIO

        taskbarCloseButton.addEventListener("click", (event) => {
          event.stopPropagation();
          pulseFeedback(taskbarCloseButton);
          closeTaskbarPopup();
        });
      }

      checkinButtons.forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          pulseFeedback(button);
          openPhotoChoices(button);
        });
      });

      photoLibraryChoices.forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          pulseFeedback(button);
          playFeedback("tap");
          openNativePhotoInput(photoLibraryInput);
        });
      });

      photoCameraChoices.forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          pulseFeedback(button);
          playFeedback("tap");
          openNativePhotoInput(photoCameraInput);
        });
      });

      [photoLibraryInput, photoCameraInput].forEach((input) => {
        input?.addEventListener("click", (event) => event.stopPropagation());
        input?.addEventListener("change", handlePhotoSelection);
        input?.addEventListener("input", handlePhotoSelection);
        input?.addEventListener("cancel", closePhotoChoices);
      });

      if (taskbarLayer) {
        taskbarLayer.addEventListener("animationend", (event) => {
          if (event.animationName === "taskbar-popup-out") {
            finishTaskbarPopup();
          }
        });
      }

      if (insightLayer) {
        insightLayer.addEventListener("animationend", (event) => {
          if (event.animationName === "insight-page-in") settleInsightOpen();
          if (event.animationName === "insight-page-out") finishInsightClose();
        });
        insightLayer.addEventListener("click", (event) => {
          event.stopPropagation();
          if (!activeInsightDetailId) return;
          if (event.target.closest("[data-insight-detail-target]")) return;
          if (event.target.closest(".insight-detail-action")) return;
          if (event.target.closest("[data-insight-photo-choice-sheet]")) return;
          closeActiveInsightDetail();
          playFeedback("close");
        });
      }

      if (partnerLayer) {
        partnerLayer.addEventListener("animationend", (event) => {
          if (event.animationName === "partner-page-in") settlePartnerOpen();
          if (event.animationName === "partner-page-out") finishPartnerClose();
        });
        partnerLayer.addEventListener("click", (event) => event.stopPropagation());
      }

      if (posterPageLayer) {
        posterPageLayer.addEventListener("animationend", (event) => {
          if (event.animationName === "poster-page-in") settlePosterOpen();
          if (event.animationName === "poster-page-out") finishPosterClose();
        });
        posterPageLayer.addEventListener("click", (event) => event.stopPropagation());
      }

      popupCards.forEach((card) => {
        card.addEventListener("animationend", (event) => {
          if (event.animationName === "card-in") settleOpen(card);
          if (event.animationName === "card-out") finishClose(card);
        });
        card.addEventListener("click", (event) => {
          event.stopPropagation();
        });
      });

      document.addEventListener("click", () => {
        if (
          insightPageState !== "closed" ||
          partnerPageState !== "closed" ||
          posterPageState !== "closed"
        ) {
          return;
        }
        hideHeartBubble();
        closePhotoChoices();
        if (!activePopupId) return;
        const closingId = activePopupId;
        activePopupId = null;
        closePopup(closingId);
        playFeedback("close");
      });

      window.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        if (insightPageState !== "closed") {
          closeInsightPage();
          return;
        }
        if (partnerPageState !== "closed") {
          closePartnerPage();
          return;
        }
        if (posterPageState !== "closed") {
          closePosterPage();
          return;
        }
        closePhotoChoices();
        if (!activePopupId) return;
        const closingId = activePopupId;
        activePopupId = null;
        closePopup(closingId);
      });

      renderCheckinProgress();
      restorePersistedState().catch(() => {});
    </script>
  </body>
</html>
